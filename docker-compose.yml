# Lokale Postgres-Datenbank für die Entwicklung (Render nutzt in Produktion eine eigene)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: redwood
      POSTGRES_PASSWORD: redwood
      POSTGRES_DB: redwoodblog
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
